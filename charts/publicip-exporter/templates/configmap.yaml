apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "publicip-exporter.fullname" . }}
  labels:
    {{- include "publicip-exporter.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |-
    {{ tpl .Values.config . | nindent 4 }}
