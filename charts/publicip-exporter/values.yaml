nameOverride: null
fullnameOverride: null

image:
  registry: docker.io
  repository: andreziviani/publicip-exporter
  # -- Overrides the image tag whose default is the chart's appVersion
  tag: null
  pullPolicy: IfNotPresent

imagePullSecrets: []

args:
  - "--config"
  - "/app/config.yaml"

env: []
# - name: MY_VAR
#   value: my-value
# - name: SECRET_VAR
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: my-key

ipinfo:
  # -- Name of an existing secret containing the ipinfo.io API token.
  # The secret must have a key matching secretKey below.
  # When set, the token is injected as the IPINFO_TOKEN environment variable,
  # taking precedence over any token set in the config block.
  # When externalSecret.enabled is true, this is auto-wired to the ESO-managed secret.
  existingSecret: ""
  secretKey: token

externalSecret:
  # -- Enable ExternalSecret to pull secrets from an external store (e.g. 1Password).
  # Requires External Secrets Operator to be installed.
  # The created Kubernetes Secret is automatically used for ipinfo token injection.
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    # -- Name of the created Kubernetes Secret. Defaults to the chart fullname.
    name: ""
  # -- Mappings from Kubernetes Secret keys to external secret references.
  data: []
  #  - secretKey: token
  #    remoteRef:
  #      key: "ipinfo API"      # 1Password item title
  #      property: credential   # 1Password field name

annotations: {}

config: |
  server:
    listen_address: ":9101"

  ipinfo:
    refresh_interval: 60s

  ping:
    interval: 5s
    count: 3
    timeout: 5s
    privileged: false
    destinations:
      - name: google-dns
        host: 8.8.8.8
      - name: cloudflare-dns
        host: 1.1.1.1

  http:
    interval: 30s
    timeout: 10s
    destinations:
      - name: google
        url: https://google.com

updateStrategy:
  type: RollingUpdate

podLabels: {}

podAnnotations: {}
#  prometheus.io/scrape: "true"
#  prometheus.io/port: "http-metrics"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
#  limits:
#    cpu: 100m
#    memory: 128Mi

podPortName: http-metrics

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 9101
  annotations: {}
  labels: {}
  portName: http-metrics

serviceAccount:
  create: true
  name: null
  labels: {}
  #annotations:
  #  eks.amazonaws.com/role-arn: ...

serviceMonitor:
  enabled: false
  path: /metrics
  labels: {}
  interval: 30s
  scheme: http
  tlsConfig: {}
  scrapeTimeout: 30s
  relabelings: []

